<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MIT AOE · Student Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --red:#C8102E;
  --red-deep:#8B0000;
  --red-glow:rgba(200,16,46,0.18);
  --gold:#C9A84C;
  --gold-light:#e8c97a;
  --dark:#0d0d0d;
  --dark2:#141414;
  --dark3:#1c1c1c;
  --dark4:#242424;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(200,16,46,0.2);
  --text:#f0ece4;
  --text2:#a09a8e;
  --text3:#5a5550;
  --surface:rgba(255,255,255,0.03);
}

html,body{
  height:100%;
  background:var(--dark);
  font-family:'Outfit',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  overflow:hidden;
}

/* Ambient background */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 10%, rgba(139,0,0,0.15) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 90%, rgba(200,16,46,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 80% 80% at 50% 50%, #0a0a0a 0%, #0d0d0d 100%);
  z-index:-1;
}

/* Noise grain overlay */
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:0;
  opacity:0.4;
}

.shell{
  width:100%;
  max-width:480px;
  height:96vh;
  max-height:820px;
  display:flex;
  flex-direction:column;
  border-radius:24px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:
    0 0 0 0.5px rgba(200,16,46,0.1),
    0 40px 120px rgba(0,0,0,0.7),
    0 0 60px rgba(139,0,0,0.05) inset;
  position:relative;
  z-index:1;
  background:var(--dark2);
}

/* ─── HEADER ─── */
.header{
  flex-shrink:0;
  padding:0 20px;
  background:linear-gradient(180deg, #1a0505 0%, #110303 100%);
  border-bottom:1px solid var(--border2);
  position:relative;
  overflow:hidden;
}

/* Decorative red shimmer bar at top */
.header::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg, transparent 0%, var(--red) 30%, var(--gold) 50%, var(--red) 70%, transparent 100%);
}

/* Subtle grid pattern in header */
.header::after{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
}

.header-inner{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 0 14px;
  position:relative;
  z-index:1;
}

/* Logo container */
.logo-wrap{
  height:54px;
  width:auto;
  background:#ffffff;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  padding:5px 10px;
  box-shadow:0 4px 20px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.3);
}

.header-copy{flex:1;min-width:0}
.header-copy h1{
  font-family:'Playfair Display',serif;
  font-size:16px;font-weight:700;
  color:var(--text);
  letter-spacing:0.02em;
  line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.header-copy p{
  font-size:11px;font-weight:400;
  color:var(--text2);
  margin-top:3px;
  letter-spacing:0.03em;
}

.status-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:20px;
  padding:5px 10px;
  flex-shrink:0;
}
.status-pip{
  width:7px;height:7px;border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 0 2px rgba(34,197,94,0.25);
  animation:pulse 2s ease infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(34,197,94,0.25)}50%{box-shadow:0 0 0 4px rgba(34,197,94,0.1)}}
.status-pill span{font-size:10px;color:#22c55e;font-weight:500;letter-spacing:0.04em}

/* Gold divider line */
.gold-line{
  height:1px;
  background:linear-gradient(90deg, transparent 0%, var(--gold) 20%, rgba(201,168,76,0.3) 80%, transparent 100%);
  opacity:0.4;
  flex-shrink:0;
}

/* ─── QUICK TOPICS ─── */
.quick-wrap{
  flex-shrink:0;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.2);
}
.quick-label{
  font-size:9px;font-weight:600;
  letter-spacing:0.12em;text-transform:uppercase;
  color:var(--text3);
  margin-bottom:7px;
}
.quick-scroll{
  display:flex;gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:2px;
}
.quick-scroll::-webkit-scrollbar{display:none}
.qbtn{
  white-space:nowrap;
  font-size:11px;font-weight:500;
  font-family:'Outfit',sans-serif;
  padding:5px 12px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.04);
  color:var(--text2);
  cursor:pointer;
  transition:all 0.18s cubic-bezier(0.34,1.56,0.64,1);
  flex-shrink:0;
  letter-spacing:0.02em;
}
.qbtn:hover{
  background:rgba(200,16,46,0.15);
  border-color:rgba(200,16,46,0.4);
  color:var(--text);
  transform:translateY(-1px);
}

/* ─── MESSAGES ─── */
.messages{
  flex:1;
  overflow-y:auto;
  padding:18px 16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  scroll-behavior:smooth;
  background:transparent;
}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:2px}

.msg{
  display:flex;gap:10px;
  max-width:88%;
  animation:msgIn 0.25s cubic-bezier(0.34,1.4,0.64,1);
}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}

.av{
  width:32px;height:32px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px;font-size:13px;
}
.bot-av{
  background:linear-gradient(135deg,#8B0000,#C8102E);
  border:1px solid rgba(200,16,46,0.3);
  box-shadow:0 4px 12px rgba(200,16,46,0.2);
}
.user-av{
  background:var(--dark4);
  border:1px solid var(--border);
  font-size:9px;font-weight:600;color:var(--text2);letter-spacing:0.04em;
}

.bubble{
  padding:11px 15px;
  border-radius:18px;
  font-size:13.5px;
  line-height:1.65;
  letter-spacing:0.01em;
}
.bot .bubble{
  background:var(--dark3);
  border:1px solid var(--border);
  border-bottom-left-radius:5px;
  color:var(--text);
  box-shadow:0 2px 16px rgba(0,0,0,0.3);
}
.user .bubble{
  background:linear-gradient(135deg, #C8102E 0%, #9B0020 100%);
  border:1px solid rgba(200,16,46,0.3);
  border-bottom-right-radius:5px;
  color:#fff;
  box-shadow:0 4px 20px rgba(200,16,46,0.25);
}
.bubble b{font-weight:600;color:#e8c97a}
.user .bubble b{color:rgba(255,255,255,0.9)}
.bubble ul{padding-left:16px;margin-top:5px}
.bubble li{margin-bottom:4px}
.bubble a{color:var(--gold-light);text-decoration:none;border-bottom:1px solid rgba(201,168,76,0.3)}
.bubble a:hover{border-bottom-color:var(--gold-light)}
.user .bubble a{color:rgba(255,255,255,0.8);border-bottom-color:rgba(255,255,255,0.3)}
.chip{
  display:inline-block;
  background:rgba(200,16,46,0.12);
  color:#e87a8a;
  border:1px solid rgba(200,16,46,0.2);
  border-radius:6px;
  padding:2px 8px;
  font-size:11px;font-weight:500;
  margin:2px 2px 2px 0;
  letter-spacing:0.03em;
}

/* Timestamp */
.ts{font-size:9px;color:var(--text3);margin-top:4px;padding:0 4px;letter-spacing:0.04em}
.msg.user .ts{text-align:right}

/* Typing indicator */
.typing-bubble{display:flex;gap:5px;align-items:center;padding:6px 4px}
.tdot{
  width:6px;height:6px;border-radius:50%;
  background:var(--text3);
  animation:tdot 1.3s ease infinite;
}
.tdot:nth-child(2){animation-delay:0.18s}
.tdot:nth-child(3){animation-delay:0.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-5px);opacity:1}}

/* ─── INPUT ─── */
.input-area{
  flex-shrink:0;
  padding:12px 16px 14px;
  background:rgba(0,0,0,0.3);
  border-top:1px solid var(--border);
  position:relative;
}
.input-area::before{
  content:'';
  position:absolute;
  top:0;left:20px;right:20px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(200,16,46,0.3), transparent);
}
.input-row{display:flex;gap:10px;align-items:center}
#inp{
  flex:1;
  padding:11px 16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.04);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  font-size:13.5px;
  font-weight:400;
  outline:none;
  transition:border-color 0.2s, background 0.2s, box-shadow 0.2s;
  caret-color:var(--red);
}
#inp::placeholder{color:var(--text3);font-size:13px}
#inp:focus{
  border-color:rgba(200,16,46,0.4);
  background:rgba(255,255,255,0.06);
  box-shadow:0 0 0 3px rgba(200,16,46,0.08);
}
#snd{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,#C8102E,#9B0020);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:transform 0.15s, box-shadow 0.15s;
  box-shadow:0 4px 14px rgba(200,16,46,0.35);
}
#snd:hover{transform:scale(1.06);box-shadow:0 6px 20px rgba(200,16,46,0.5)}
#snd:active{transform:scale(0.96)}
#snd svg{width:18px;height:18px;fill:white}

.footer-bar{
  display:flex;align-items:center;justify-content:center;
  gap:6px;
  padding:7px 16px 10px;
  background:rgba(0,0,0,0.3);
}
.footer-bar span{font-size:9.5px;color:var(--text3);letter-spacing:0.06em;text-transform:uppercase}
.footer-dot{width:3px;height:3px;border-radius:50%;background:var(--text3);opacity:0.4}
</style>
</head>

<div class="shell">

  <div class="gold-line"></div>

  <!-- QUICK TOPICS -->
  <div class="quick-wrap">

      <button class="qbtn" onclick="qa('Campus facilities')">🏛️ Facilities</button>
      <button class="qbtn" onclick="qa('Exam schedule')">📅 Exams</button>

      <button class="qbtn" onclick="qa('Transport facility')">🚌 Transport</button>
      <button class="qbtn" onclick="qa('Contact information')">📞 Contact</button>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="msgs"></div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-row">
      <input id="inp" type="text" placeholder="Ask anything about MIT AOE…" autocomplete="off"/>
      <button id="snd" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <div class="footer-bar">
    <span>MIT AOE Student Chatbot</span>
    <div class="footer-dot"></div>
    <span>College Project</span>
  </div>

const GREET=['hi','hello','hey','namaste','good morning','good evening','howdy','sup','hii','helo','hai'];

const DEFAULT=`I don't have info on that yet. Try asking about:<br><br>
<span class="chip">Courses</span><span class="chip">Admissions</span><span class="chip">Fees</span>
<span class="chip">Scholarships</span><span class="chip">Hostel</span><span class="chip">Placements</span>
<span class="chip">Facilities</span><span class="chip">Exams</span><span class="chip">Faculty</span>
<span class="chip">Clubs</span><span class="chip">Transport</span><span class="chip">Contact</span>`;

function getResp(q){
  const t=q.toLowerCase().trim();
  if(GREET.some(g=>t===g||t.startsWith(g+' ')))
    return `Welcome! I'm the <b>MIT AOE Student Assistant</b> 🎓<br><br>Ask me anything about <b>MIT Academy of Engineering, Pune</b> — courses, fees, hostel, placements, exams & more.<br><br>How can I help you today?`;
  if(/thank|thanks|tysm|dhanyawad/i.test(t))
    return `You're welcome! Feel free to ask anything else about MIT AOE. All the best with your journey! 🎓`;
  if(/bye|goodbye|tata/i.test(t))
    return `Goodbye! Best of luck at MIT AOE. Come back anytime! 👋`;
  for(const v of Object.values(KB))
    if(v.k.some(k=>t.includes(k))) return v.r;
  return DEFAULT;
}

function now(){
  const d=new Date();
  return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function addMsg(html,who){
  const box=document.getElementById('msgs');
  const wrap=document.createElement('div');
  wrap.className=`msg ${who}`;
  const av=who==='bot'
    ?`<div class="av bot-av">🎓</div>`
    :`<div class="av user-av">YOU</div>`;
  wrap.innerHTML=`${av}<div><div class="bubble">${html}</div><div class="ts">${now()}</div></div>`;
  box.appendChild(wrap);
  box.scrollTop=box.scrollHeight;
}

function showTyping(){
  const box=document.getElementById('msgs');
  const t=document.createElement('div');
  t.id='typing';t.className='msg bot';
  t.innerHTML=`<div class="av bot-av">🎓</div><div class="bubble"><div class="typing-bubble"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div></div>`;
  box.appendChild(t);box.scrollTop=box.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove();}

function send(){
  const inp=document.getElementById('inp');
  const v=inp.value.trim();
  if(!v)return;
  addMsg(v,'user');
  inp.value='';
  showTyping();
  setTimeout(()=>{removeTyping();addMsg(getResp(v),'bot');},650+Math.random()*400);
}

function qa(q){document.getElementById('inp').value=q;send();}

document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send();});

window.addEventListener('load',()=>{

I have comprehensive information about <b>MIT Academy of Engineering, Pune</b> — from admissions & fees to placements, hostel, clubs and more.<br><br>
Use the quick-access buttons above or type your question below!`,'bot');
  },350);
});
</script>
